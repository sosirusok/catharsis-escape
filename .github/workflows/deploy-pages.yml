name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build GitHub Pages site
        env:
          PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN }}
        shell: bash
        run: |
          case "${GITHUB_REPOSITORY##*/}" in
            catharsis-escape) npm run export:pages:customer ;;
            catharsis-2vdf9n5pq1) npm run export:pages:admin ;;
            *) echo "Unsupported repository: ${GITHUB_REPOSITORY}" >&2; exit 64 ;;
          esac
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
