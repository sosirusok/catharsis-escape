name: Build owner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "owner-app/**"
      - ".github/workflows/build-owner-apk.yml"

permissions:
  contents: write

concurrency:
  group: owner-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'sosirusok/catharsis-2vdf9n5pq1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked signing keys
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx|pk8|key|pem)$'; then
            echo "Private signing material must not be committed." >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build APKs
        env:
          OWNER_VERSION_CODE: ${{ github.run_number }}
          OWNER_API_BASE: ${{ vars.OWNER_API_BASE }}
          OWNER_FIREBASE_APP_ID: ${{ vars.OWNER_FIREBASE_APP_ID }}
          OWNER_FIREBASE_PROJECT_ID: ${{ vars.OWNER_FIREBASE_PROJECT_ID }}
          OWNER_FIREBASE_SENDER_ID: ${{ vars.OWNER_FIREBASE_SENDER_ID }}
          OWNER_FIREBASE_API_KEY: ${{ vars.OWNER_FIREBASE_API_KEY }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Prepare APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Catharsis-Owner-install.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Catharsis-Owner-unsigned.apk
          cd dist
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose Catharsis-Owner-install.apk
          sha256sum Catharsis-Owner-install.apk > Catharsis-Owner-install.apk.sha256
          sha256sum Catharsis-Owner-unsigned.apk > Catharsis-Owner-unsigned.apk.sha256

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Catharsis-Owner-Installable-APK
          path: |
            owner-app/dist/Catharsis-Owner-install.apk
            owner-app/dist/Catharsis-Owner-install.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Catharsis-Owner-Unsigned-APK
          path: |
            owner-app/dist/Catharsis-Owner-unsigned.apk
            owner-app/dist/Catharsis-Owner-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish installable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: owner-v1.0.${{ github.run_number }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          release_title="카타르시스 예약 알림 1.0.${GITHUB_RUN_NUMBER}"
          release_notes="Android 8.0 이상에서 설치할 수 있는 관리자용 APK입니다. 기존 앱과 서명키가 다르면 기존 앱을 삭제한 뒤 설치해 주세요."

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              owner-app/dist/Catharsis-Owner-install.apk \
              owner-app/dist/Catharsis-Owner-install.apk.sha256 \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              owner-app/dist/Catharsis-Owner-install.apk \
              owner-app/dist/Catharsis-Owner-install.apk.sha256 \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --latest
          fi
